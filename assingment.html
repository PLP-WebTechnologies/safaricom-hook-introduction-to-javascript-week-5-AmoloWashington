<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Assignment</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>JavaScript Assignment</h1>

    <p>Learning JavaScript is fun!</p>

    <div id="dynamic-content"></div>

    <ol id="number-list"></ol>

    <div id="calculator-section">
        <h2>Simple Calculator</h2>
        <button onclick="calculator()">Open Calculator</button>
    </div>

    <div id="greet-section">
        <h2>Greet User</h2>
        <button onclick="greetUser(prompt('Enter your name:'))">Greet</button>
    </div>

    <div id="voting-section">
        <h2>Check Voting Eligibility</h2>
        <button onclick="checkVotingEligibility()">Check Eligibility</button>
    </div>
</body>
</html>
